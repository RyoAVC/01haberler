name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://haberler:changeme@localhost:5432/haberler01?schema=public"
      DIRECT_URL: "postgresql://haberler:changeme@localhost:5432/haberler01?schema=public"
      REDIS_URL: "redis://localhost:6379"
      SESSION_SECRET: "ci-test-secret-please-override-in-production-0000000000"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haberler
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: haberler01
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haberler -d haberler01"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts=false

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Create isolated CI database schema
        run: npx prisma db push --skip-generate

      - name: Build
        run: npm run build

      - name: Seed database
        run: npm run prisma:seed
        env:
          SEED_ADMIN_EMAIL: "e2e@01haberler.com"
          SEED_ADMIN_PASSWORD: "CiTestParola123!"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          E2E_ADMIN_EMAIL: "e2e@01haberler.com"
          E2E_ADMIN_PASSWORD: "CiTestParola123!"

      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
